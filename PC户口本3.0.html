                            appDiv.style.borderRadius = '8px';
                            appDiv.style.padding = '12px';
                            appDiv.style.marginBottom = '10px';
                            appDiv.innerHTML = `<div style="font-weight:600; margin-bottom:5px;">${app.module || '未命名模组'}</div><div style="margin-bottom:5px;">${app.rule ? `<span class="tag">${app.rule}</span>` : ''}${app.background ? `<span class="tag">${app.background}</span>` : ''}${app.era ? `<span class="tag">${app.era}</span>` : ''}${app.outcome ? `<span class="tag">${app.outcome}</span>` : ''}</div>`;
                            if (app.teammates && app.teammates.length) {
                                const tmDiv = document.createElement('div');
                                tmDiv.innerHTML = '<div style="font-weight:600; margin-top:8px;">队友：</div>';
                                const tmList = document.createElement('ul');
                                tmList.style.margin = '5px 0 0 0';
                                tmList.style.paddingLeft = '20px';
                                app.teammates.forEach(tm => {
                                    const li = document.createElement('li');
                                    li.textContent = `${tm.pc} (PL: ${tm.pl}) ${tm.contact}`;
                                    tmList.appendChild(li);
                                });
                                tmDiv.appendChild(tmList);
                                appDiv.appendChild(tmDiv);
                            }
                            pcDiv.appendChild(appDiv);
                        });
                    }
                    container.appendChild(pcDiv);
                });
                return container;
            };

            const buildOverview = () => {
                const container = document.createElement('div');
                container.style.padding = '20px';
                container.style.background = 'var(--bg)';
                container.style.width = '800px';
                pcs.forEach(pc => {
                    const pcDiv = document.createElement('div');
                    pcDiv.className = 'card';
                    const row = document.createElement('div');
                    row.style.display = 'flex';
                    row.style.gap = '20px';
                    if (pc.avatar) {
                        const img = document.createElement('img');
                        img.src = pc.avatar;
                        img.style.width = '60px';
                        img.style.height = '60px';
                        img.style.borderRadius = '50%';
                        img.style.objectFit = 'cover';
                        row.appendChild(img);
                    }
                    const infoDiv = document.createElement('div');
                    infoDiv.innerHTML = `<h3 style="margin:0 0 5px 0;">${pc.name}</h3><div>${pc.gender ? `<span class="tag">${pc.gender}</span>` : ''}${pc.age ? `<span class="tag">${pc.age}岁</span>` : ''}${pc.occupation ? `<span class="tag">${pc.occupation}</span>` : ''}${pc.nationality ? `<span class="tag">${pc.nationality}</span>` : ''}</div>${pc.appearances && pc.appearances.length ? `<div style="margin-top:5px; color:var(--text-light);">${pc.appearances[0].module} · ${pc.appearances[0].outcome || '未知'}</div>` : ''}`;
                    row.appendChild(infoDiv);
                    pcDiv.appendChild(row);
                    container.appendChild(pcDiv);
                });
                return container;
            };

            const buildSinglePc = (pcId) => {
                const pc = pcs.find(p => p.id === pcId);
                if (!pc) return null;
                const container = document.createElement('div');
                container.style.padding = '20px';
                container.style.background = 'var(--bg)';
                container.style.width = '800px';
                const pcDiv = document.createElement('div');
                pcDiv.className = 'card';
                const header = document.createElement('div');
                header.style.display = 'flex';
                header.style.gap = '20px';
                header.style.marginBottom = '15px';
                if (pc.avatar) {
                    const img = document.createElement('img');
                    img.src = pc.avatar;
                    img.style.width = '60px';
                    img.style.height = '60px';
                    img.style.borderRadius = '50%';
                    img.style.objectFit = 'cover';
                    header.appendChild(img);
                }
                const infoDiv = document.createElement('div');
                infoDiv.innerHTML = `<h2 style="margin:0 0 5px 0; color: var(--primary);">${pc.name}</h2><div>${pc.gender ? `<span class="tag">${pc.gender}</span>` : ''}${pc.age ? `<span class="tag">${pc.age}岁</span>` : ''}${pc.occupation ? `<span class="tag">${pc.occupation}</span>` : ''}${pc.nationality ? `<span class="tag">${pc.nationality}</span>` : ''}</div>`;
                header.appendChild(infoDiv);
                pcDiv.appendChild(header);
                if (pc.attributes && pc.attributes.length) {
                    const attrTitle = document.createElement('h4');
                    attrTitle.textContent = '属性';
                    pcDiv.appendChild(attrTitle);
                    const attrGrid = document.createElement('div');
                    attrGrid.style.display = 'grid';
                    attrGrid.style.gridTemplateColumns = 'repeat(2, 1fr)';
                    attrGrid.style.gap = '5px';
                    pc.attributes.forEach(attr => {
                        const attrItem = document.createElement('div');
                        attrItem.style.display = 'flex';
                        attrItem.style.justifyContent = 'space-between';
                        attrItem.style.padding = '4px 8px';
                        attrItem.style.background = 'var(--bg)';
                        attrItem.style.borderRadius = '4px';
                        attrItem.innerHTML = `<span style="font-weight:600;">${attr.name}</span> <span>${attr.value}</span>`;
                        attrGrid.appendChild(attrItem);
                    });
                    pcDiv.appendChild(attrGrid);
                }
                if (pc.background) {
                    const bgTitle = document.createElement('h4');
                    bgTitle.textContent = '背景';
                    pcDiv.appendChild(bgTitle);
                    const bgPara = document.createElement('p');
                    bgPara.style.background = 'var(--bg)';
                    bgPara.style.padding = '10px';
                    bgPara.style.borderRadius = '8px';
                    bgPara.style.whiteSpace = 'pre-wrap';
                    bgPara.textContent = pc.background;
                    pcDiv.appendChild(bgPara);
                }
                if (pc.appearances && pc.appearances.length) {
                    const appTitle = document.createElement('h4');
                    appTitle.textContent = '登场情况';
                    pcDiv.appendChild(appTitle);
                    pc.appearances.forEach(app => {
                        const appDiv = document.createElement('div');
                        appDiv.style.border = '1px solid var(--border)';
                        appDiv.style.borderRadius = '8px';
                        appDiv.style.padding = '12px';
                        appDiv.style.marginBottom = '10px';
                        appDiv.innerHTML = `<div style="font-weight:600; margin-bottom:5px;">${app.module || '未命名模组'}</div><div style="margin-bottom:5px;">${app.rule ? `<span class="tag">${app.rule}</span>` : ''}${app.background ? `<span class="tag">${app.background}</span>` : ''}${app.era ? `<span class="tag">${app.era}</span>` : ''}${app.outcome ? `<span class="tag">${app.outcome}</span>` : ''}</div>`;
                        if (app.teammates && app.teammates.length) {
                            const tmDiv = document.createElement('div');
                            tmDiv.innerHTML = '<div style="font-weight:600; margin-top:8px;">队友：</div>';
                            const tmList = document.createElement('ul');
                            tmList.style.margin = '5px 0 0 0';
                            tmList.style.paddingLeft = '20px';
                            app.teammates.forEach(tm => {
                                const li = document.createElement('li');
                                li.textContent = `${tm.pc} (PL: ${tm.pl}) ${tm.contact}`;
                                tmList.appendChild(li);
                            });
                            tmDiv.appendChild(tmList);
                            appDiv.appendChild(tmDiv);
                        }
                        pcDiv.appendChild(appDiv);
                    });
                }
                container.appendChild(pcDiv);
                return container;
            };

            const buildStats = () => {
                const container = document.createElement('div');
                container.style.padding = '20px';
                container.style.background = 'var(--bg)';
                container.style.width = '800px';

                const genderMap = {}, nationalityMap = {}, occupationMap = {}, ruleMap = {}, outcomeMap = {}, eraMap = {};
                pcs.forEach(pc => {
                    if (pc.gender) genderMap[pc.gender] = (genderMap[pc.gender] || 0) + 1;
                    if (pc.nationality) nationalityMap[pc.nationality] = (nationalityMap[pc.nationality] || 0) + 1;
                    if (pc.occupation) occupationMap[pc.occupation] = (occupationMap[pc.occupation] || 0) + 1;
                    (pc.appearances || []).forEach(app => {
                        if (app.rule) ruleMap[app.rule] = (ruleMap[app.rule] || 0) + 1;
                        if (app.outcome) outcomeMap[app.outcome] = (outcomeMap[app.outcome] || 0) + 1;
                        if (app.era) eraMap[app.era] = (eraMap[app.era] || 0) + 1;
                    });
                });

                const root = getComputedStyle(document.body);
                const primary = root.getPropertyValue('--primary').trim();
                const light = root.getPropertyValue('--primary-light').trim();
                const dark = root.getPropertyValue('--primary-dark').trim();
                const cardBg = root.getPropertyValue('--card-bg').trim();
                const colors = [primary, light, dark, '#b0a5a5', '#c2b2b2', '#d8c8c8'];

                const createPieChart = (data, titleText) => {
                    const box = document.createElement('div');
                    box.className = 'chart-box';

                    const title = document.createElement('div');
                    title.className = 'chart-title';
                    title.textContent = titleText;
                    box.appendChild(title);

                    const total = data.reduce((s, d) => s + d.value, 0);
                    if (total === 0) {
                        const empty = document.createElement('div');
                        empty.style.textAlign = 'center';
                        empty.style.padding = '20px';
                        empty.style.color = 'var(--text-light)';
                        empty.textContent = '暂无数据';
                        box.appendChild(empty);
                        return box;
                    }

                    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                    svg.setAttribute('width', '120');
                    svg.setAttribute('height', '120');
                    svg.setAttribute('viewBox', '0 0 100 100');
                    svg.classList.add('pie-svg');
                    svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg'); // 显式设置

                    // 使用修复后的 generatePieData 获取切片
                    const slices = generatePieData(data);
                    slices.forEach((slice, i) => {
                        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        path.setAttribute('d', slice.path);
                        path.setAttribute('fill', slice.color);
                        path.setAttribute('stroke', 'white');
                        path.setAttribute('stroke-width', '1');
                        
                        const titleElem = document.createElementNS('http://www.w3.org/2000/svg', 'title');
                        const percent = Math.round((slice.value / total) * 100);
                        titleElem.textContent = `${slice.label} · ${percent}%`;
                        path.appendChild(titleElem);

                        svg.appendChild(path);
                    });

                    // 添加中心圆
                    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    circle.setAttribute('cx', '50');
                    circle.setAttribute('cy', '50');
                    circle.setAttribute('r', '20');
                    circle.setAttribute('fill', cardBg);
                    circle.setAttribute('stroke', 'white');
                    circle.setAttribute('stroke-width', '1');
                    svg.appendChild(circle);

                    box.appendChild(svg);

                    const legend = document.createElement('div');
                    legend.className = 'pie-legend';
                    data.forEach((item, i) => {
                        const legItem = document.createElement('div');
                        legItem.className = 'legend-item';
                        const colorDiv = document.createElement('div');
                        colorDiv.className = 'legend-color';
                        colorDiv.style.background = item.color;
                        legItem.appendChild(colorDiv);
                        const span = document.createElement('span');
                        span.textContent = `${item.label} (${item.value})`;
                        legItem.appendChild(span);
                        legend.appendChild(legItem);
                    });
                    box.appendChild(legend);

                    return box;
                };

                const header = document.createElement('div');
                header.className = 'stats-header';
                header.textContent = `现有PC数量：${pcs.length}`;
                container.appendChild(header);

                const chartContainer = document.createElement('div');
                chartContainer.className = 'chart-container';

                const genderData = Object.entries(genderMap).map(([k,v]) => ({label:k, value:v, color: colors[0]}));
                const nationalityData = Object.entries(nationalityMap).map(([k,v]) => ({label:k, value:v, color: colors[1]}));
                const occupationData = Object.entries(occupationMap).map(([k,v]) => ({label:k, value:v, color: colors[2]}));
                const ruleData = Object.entries(ruleMap).map(([k,v]) => ({label:k, value:v, color: colors[3]}));
                const outcomeData = Object.entries(outcomeMap).map(([k,v]) => ({label:k, value:v, color: colors[4]}));
                const eraData = Object.entries(eraMap).map(([k,v]) => ({label:k, value:v, color: colors[5]}));

                chartContainer.appendChild(createPieChart(genderData, '性别分布'));
                chartContainer.appendChild(createPieChart(nationalityData, '国籍分布'));
                chartContainer.appendChild(createPieChart(occupationData, '职业分布'));
                chartContainer.appendChild(createPieChart(ruleData, '规则使用'));
                chartContainer.appendChild(createPieChart(outcomeData, '模组结局'));
                chartContainer.appendChild(createPieChart(eraData, '模组年代'));

                container.appendChild(chartContainer);
                return container;
            };

            const handleExport = (type, format) => {
                tryExport(type, format);
            };

            return (
                <div>
                    {isExporting && <div style={{ position: 'fixed', top: '50%', left: '50%', transform: 'translate(-50%, -50%)', background: 'rgba(0,0,0,0.7)', color: 'white', padding: '10px 20px', borderRadius: '8px', zIndex: 10000 }}>正在生成，请稍候...</div>}
                    <div className="share-grid">
                        <div className="share-btn-group"><h3>分享完整户口本</h3><p>导出所有PC的详细信息</p><div className="btn-row"><button className="btn" onClick={() => handleExport('full', 'pdf')}>保存为PDF</button><button className="btn btn-outline" onClick={() => handleExport('full', 'png')}>下载PNG</button></div></div>
                        <div className="share-btn-group"><h3>分享简略户口本</h3><p>仅导出PC概览卡片</p><div className="btn-row"><button className="btn" onClick={() => handleExport('overview', 'pdf')}>保存为PDF</button><button className="btn btn-outline" onClick={() => handleExport('overview', 'png')}>下载PNG</button></div></div>
                        <div className="share-btn-group"><h3>分享特定PC</h3><p>选择一个PC导出详细页</p><select className="share-select" value={selectedPcId} onChange={(e) => setSelectedPcId(e.target.value)}><option value="">请选择PC</option>{pcs.map(pc => <option key={pc.id} value={pc.id}>{pc.name}</option>)}</select><div className="btn-row"><button className="btn" onClick={() => handleExport('single', 'pdf')}>PDF</button><button className="btn btn-outline" onClick={() => handleExport('single', 'png')}>PNG</button></div></div>
                        <div className="share-btn-group"><h3>分享统计数据</h3><p>导出统计页面</p><div className="btn-row"><button className="btn" onClick={() => handleExport('stats', 'pdf')}>PDF</button><button className="btn btn-outline" onClick={() => handleExport('stats', 'png')}>PNG</button></div></div>
                    </div>
                </div>
            );
        }

        // ---------- 数据备份页面 ----------
        function Backup({ pcs, setPcs, customTags, setCustomTags, setTab }) {
            const [message, setMessage] = useState('');
            const fileInputRef = useRef(null);

            const exportData = () => {
                const data = {
                    pcs,
                    customTags,
                    version: 1,
                    exportDate: new Date().toISOString()
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `pc_backup_${new Date().toISOString().slice(0,10)}.json`;
                a.click();
                URL.revokeObjectURL(url);
                setMessage('数据导出成功！');
                setTimeout(() => setMessage(''), 3000);
            };

            const importData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const content = ev.target.result.replace(/^\uFEFF/, '');
                        const data = JSON.parse(content);
                        if (!data.pcs || !Array.isArray(data.pcs)) {
                            setMessage('导入失败：文件格式不正确（缺少pcs数组）');
                            return;
                        }
                        const sanitizedPcs = data.pcs.map((pc, index) => {
                            const newPc = {
                                ...BLANK_PC,
                                ...pc,
                                attributes: pc.attributes || BLANK_PC.attributes,
                                appearances: pc.appearances || BLANK_PC.appearances
                            };
                            if (!newPc.id || typeof newPc.id !== 'number') {
                                newPc.id = Date.now() + index;
                            }
                            return newPc;
                        });
                        setPcs(sanitizedPcs);
                        if (data.customTags && typeof data.customTags === 'object') {
                            setCustomTags(data.customTags);
                        }
                        setMessage('数据导入成功！');
                        setTab('overview');
                    } catch (err) {
                        setMessage('导入失败：文件解析错误 - ' + err.message);
                    }
                    setTimeout(() => setMessage(''), 3000);
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            return (
                <div className="backup-panel">
                    <h2 style={{ color: 'var(--primary)', marginTop: 0 }}>数据备份与恢复</h2>
                    <p style={{ color: 'var(--text-light)' }}>导出所有PC数据和自定义标签，可在另一设备导入，防止数据丢失。</p>
                    <div className="backup-actions">
                        <button className="btn" onClick={exportData}>导出数据</button>
                        <button className="btn btn-outline" onClick={() => fileInputRef.current.click()}>导入数据</button>
                        <input ref={fileInputRef} type="file" accept=".json" onChange={importData} style={{ display: 'none' }} />
                    </div>
                    {message && <div className="backup-message">{message}</div>}
                </div>
            );
        }

        // ---------- 主应用组件 ----------
        function App() {
            const [theme, setTheme] = useState('morandi-pink');
            const [tab, setTab] = useState('overview');
            const [pcs, setPcs] = useState([]);
            const [customTags, setCustomTags] = useState({});

            useEffect(() => {
                const savedPcs = localStorage.getItem(PC_DATA_KEY);
                if (savedPcs) {
                    try {
                        const parsed = JSON.parse(savedPcs);
                        const sanitized = parsed.map(pc => ({
                            ...BLANK_PC,
                            ...pc,
                            attributes: pc.attributes || BLANK_PC.attributes,
                            appearances: pc.appearances || BLANK_PC.appearances
                        }));
                        setPcs(sanitized);
                    } catch {
                        setPcs([]);
                    }
                }
                const savedTags = localStorage.getItem(CUSTOM_TAGS_KEY);
                if (savedTags) {
                    try {
                        setCustomTags(JSON.parse(savedTags));
                    } catch {
                        setCustomTags({});
                    }
                }
            }, []);

            useEffect(() => {
                localStorage.setItem(PC_DATA_KEY, JSON.stringify(pcs));
            }, [pcs]);

            useEffect(() => {
                localStorage.setItem(CUSTOM_TAGS_KEY, JSON.stringify(customTags));
            }, [customTags]);

            useEffect(() => {
                document.body.className = `theme-${theme}`;
            }, [theme]);

            const navItems = [
                { key: 'overview', label: 'PC概览' },
                { key: 'stats', label: '数据统计' },
                { key: 'add', label: '加入PC' },
                { key: 'share', label: '分享户口本' },
                { key: 'backup', label: '数据备份' }
            ];

            const themes = [
                { key: 'morandi-pink', color: '#c0a5a5' },
                { key: 'morandi-green', color: '#a8bbaa' },
                { key: 'morandi-blue', color: '#9bb0c0' },
                { key: 'morandi-purple', color: '#b5a9c2' },
                { key: 'morandi-yellow', color: '#ccbfa7' },
                { key: 'morandi-brown', color: '#c9b3a5' }
            ];

            return (
                <div className="app">
                    <div className="app-header">
                        <span className="app-title">PC户口本</span>
                        <span className="app-author">
                            软件作者：闻风见 · <a href="mailto:3152834229@qq.com">3152834229@qq.com</a>
                        </span>
                    </div>

                    <div className="navbar">
                        <div className="nav-links">
                            {navItems.map(item => (
                                <div key={item.key} className={`nav-link ${tab === item.key ? 'active' : ''}`} onClick={() => setTab(item.key)}>
                                    {item.label}
                                </div>
                            ))}
                        </div>
                        <div className="theme-selector">
                            {themes.map(t => (
                                <div key={t.key} className="theme-dot" style={{ backgroundColor: t.color }} onClick={() => setTheme(t.key)} title={t.key.replace('morandi-', '')} />
                            ))}
                        </div>
                    </div>

                    {tab === 'overview' && <Overview pcs={pcs} setPcs={setPcs} customTags={customTags} setCustomTags={setCustomTags} />}
                    {tab === 'stats' && <Stats pcs={pcs} />}
                    {tab === 'add' && <AddPc pcs={pcs} setPcs={setPcs} setTab={setTab} customTags={customTags} setCustomTags={setCustomTags} />}
                    {tab === 'share' && <Share pcs={pcs} />}
                    {tab === 'backup' && <Backup pcs={pcs} setPcs={setPcs} customTags={customTags} setCustomTags={setCustomTags} setTab={setTab} />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
