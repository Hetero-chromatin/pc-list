<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>PC户口本 · 最终版</title>
    <!-- React and Babel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <!-- html2canvas & jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ========== 莫兰迪主题变量 ========== */
        .theme-morandi-pink {
            --primary: #c0a5a5;
            --primary-light: #d6bebe;
            --primary-dark: #a58a8a;
            --bg: #f5f0f0;
            --card-bg: #ffffff;
            --text: #5e4b4b;
            --text-light: #8f7a7a;
            --border: #d9cdcd;
            --shadow: rgba(192, 165, 165, 0.2);
            --tag-bg: #ecd9d9;
            --tag-text: #a58a8a;
        }
        .theme-morandi-green {
            --primary: #a8bbaa;
            --primary-light: #c2d2c4;
            --primary-dark: #8a9f8c;
            --bg: #f0f3ef;
            --card-bg: #ffffff;
            --text: #4f5e51;
            --text-light: #7c8d7e;
            --border: #cfd9cf;
            --shadow: rgba(168, 187, 170, 0.2);
            --tag-bg: #dee9df;
            --tag-text: #8a9f8c;
        }
        .theme-morandi-blue {
            --primary: #9bb0c0;
            --primary-light: #b5c9d9;
            --primary-dark: #7f95a8;
            --bg: #eff3f7;
            --card-bg: #ffffff;
            --text: #4b5a66;
            --text-light: #778b9a;
            --border: #cbd5de;
            --shadow: rgba(155, 176, 192, 0.2);
            --tag-bg: #d8e2ec;
            --tag-text: #7f95a8;
        }
        .theme-morandi-purple {
            --primary: #b5a9c2;
            --primary-light: #cfc4db;
            --primary-dark: #978ca8;
            --bg: #f5f2f9;
            --card-bg: #ffffff;
            --text: #584e67;
            --text-light: #807996;
            --border: #dbd2e6;
            --shadow: rgba(181, 169, 194, 0.2);
            --tag-bg: #e7dfef;
            --tag-text: #978ca8;
        }
        .theme-morandi-yellow {
            --primary: #ccbfa7;
            --primary-light: #e1d6c2;
            --primary-dark: #b3a58b;
            --bg: #faf7f0;
            --card-bg: #ffffff;
            --text: #625948;
            --text-light: #938a77;
            --border: #e1d9cb;
            --shadow: rgba(204, 191, 167, 0.2);
            --tag-bg: #f0e8da;
            --tag-text: #b3a58b;
        }
        .theme-morandi-brown {
            --primary: #c9b3a5;
            --primary-light: #dfcdc1;
            --primary-dark: #b09688;
            --bg: #f7f2ee;
            --card-bg: #ffffff;
            --text: #615349;
            --text-light: #938279;
            --border: #e0d3ca;
            --shadow: rgba(201, 179, 165, 0.2);
            --tag-bg: #efe2da;
            --tag-text: #b09688;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background 0.2s, color 0.2s;
        }

        * {
            box-sizing: border-box;
        }

        .app {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 顶部标题栏 */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .app-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-dark);
        }
        .app-author {
            font-size: 0.8rem;
            color: var(--text-light);
        }
        .app-author a {
            color: var(--primary);
            text-decoration: none;
        }

        /* 导航栏 */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border);
            flex-wrap: wrap;
            gap: 10px;
        }

        .nav-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-link {
            padding: 8px 16px;
            border-radius: 30px;
            background: transparent;
            color: var(--text-light);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .nav-link.active {
            background: var(--primary);
            color: white;
        }

        .theme-selector {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .theme-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid white;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* 卡片 */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 12px var(--shadow);
            border: 1px solid var(--border);
        }

        /* 按钮 */
        .btn {
            padding: 8px 16px;
            border-radius: 30px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
        }

        .btn-sm {
            padding: 4px 12px;
            font-size: 0.85rem;
        }

        .btn-danger {
            background: #b09688;
            border-color: #b09688;
            color: white;
        }
        .btn-danger:hover {
            background: #9d8072;
        }

        /* 标签（用于展示） */
        .tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 30px;
            background: var(--tag-bg);
            color: var(--tag-text);
            font-size: 0.8rem;
            font-weight: 500;
            margin-right: 5px;
            margin-bottom: 5px;
        }

        /* 表单 */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            background: white;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: 2px solid var(--primary-light);
        }

        /* 自定义标签选择器（下拉式） */
        .tag-selector {
            position: relative;
            width: 100%;
        }

        .tag-selector-display {
            min-height: 42px;
            padding: 5px 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: white;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            align-items: center;
            cursor: pointer;
        }

        .tag-selector-display .tag {
            margin: 0;
            padding-right: 22px;
            position: relative;
        }

        .tag-selector-display .tag .remove-tag {
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--primary-light);
            color: white;
            font-size: 10px;
            line-height: 14px;
            text-align: center;
            cursor: pointer;
        }

        .tag-selector-display .placeholder {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .tag-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 200px;
            overflow-y: auto;
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-top: 4px;
            box-shadow: 0 4px 12px var(--shadow);
            z-index: 10;
        }

        .tag-dropdown-item {
            padding: 8px 12px;
            cursor: pointer;
            transition: background 0.1s;
            border-bottom: 1px solid var(--border);
        }

        .tag-dropdown-item:last-child {
            border-bottom: none;
        }

        .tag-dropdown-item:hover {
            background: var(--bg);
        }

        .tag-dropdown-item.new-tag {
            color: var(--primary);
            font-weight: 600;
            border-top: 1px dashed var(--border);
        }

        .tag-dropdown-item.new-tag:hover {
            background: var(--tag-bg);
        }

        .new-tag-input {
            display: flex;
            padding: 8px;
            gap: 5px;
            background: white;
            border-top: 1px solid var(--border);
        }

        .new-tag-input input {
            flex: 1;
            padding: 6px;
            border: 1px solid var(--border);
            border-radius: 6px;
        }

        .new-tag-input button {
            padding: 6px 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        /* 头像上传 (新裁剪样式) */
        .avatar-upload {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--primary-light);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            overflow: hidden;
            border: 3px solid var(--primary);
            flex-shrink: 0;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-upload input {
            display: none;
        }

        .avatar-upload label {
            background: var(--primary);
            color: white;
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
        }

        /* 裁剪模态框 */
        .crop-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .crop-modal {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .crop-canvas-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        .crop-canvas {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            cursor: grab;
            background: #f0f0f0;
        }
        .crop-canvas:active {
            cursor: grabbing;
        }
        .crop-slider {
            width: 100%;
            margin: 15px 0;
        }
        .crop-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        /* 概览卡片 */
        .pc-card {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .pc-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--primary-light);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            overflow: hidden;
            flex-shrink: 0;
            border: 2px solid var(--primary);
        }

        .pc-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .pc-info {
            flex: 1;
            min-width: 200px;
        }

        .pc-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary-dark);
            cursor: pointer;
        }

        .pc-meta {
            margin-top: 5px;
        }

        .pc-detail {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed var(--border);
        }

        /* 详情页中的编辑按钮和删除按钮 */
        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .detail-actions {
            display: flex;
            gap: 8px;
        }

        .btn-delete {
            background: transparent;
            border: 1px solid #b09688;
            color: #b09688;
        }
        .btn-delete:hover {
            background: #b09688;
            color: white;
        }

        /* 统计数据 */
        .stats-header {
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary);
        }

        .chart-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .chart-box {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .chart-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 15px;
            text-align: center;
        }

        .pie-svg {
            display: block;
            margin: 0 auto;
            width: 120px;
            height: 120px;
        }

        .pie-svg path {
            transition: opacity 0.2s;
            cursor: default;
        }
        .pie-svg path:hover {
            opacity: 0.8;
        }

        .pie-legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.8rem;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 4px;
        }

        /* 分享页面 */
        .share-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .share-btn-group {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .share-btn-group h3 {
            margin-top: 0;
            color: var(--primary);
        }

        .share-btn-group .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .share-select {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 10px;
            background: white;
        }

        /* 数据备份页面 */
        .backup-panel {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 12px var(--shadow);
        }
        .backup-actions {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .backup-message {
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
        }

        /* 模态框 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal {
            max-width: 800px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .modal-header h2 {
            margin: 0;
            color: var(--primary);
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
        }

        /* 工具类 */
        .full-width {
            grid-column: span 2;
        }
        /* 导出临时容器 - 克隆后放置于可视区域，截图后移除 */
        .export-temp {
            position: absolute;
            left: 0;
            top: 0;
            width: 800px; /* 固定宽度，保证清晰度 */
            background: var(--bg);
            z-index: 9999;
            pointer-events: none;
        }
        .mt-4 { margin-top: 20px; }
        .mb-2 { margin-bottom: 10px; }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        /* 手机适配 */
        @media (max-width: 640px) {
            .app { padding: 12px; }
            .app-header { flex-direction: column; align-items: flex-start; gap: 5px; }
            .nav-links { justify-content: center; }
            .navbar { flex-direction: column; align-items: flex-start; }
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            .chart-container { grid-template-columns: 1fr; }
            .share-grid { grid-template-columns: 1fr; }
            .pc-card { flex-direction: column; align-items: flex-start; }
            .modal { width: 95%; padding: 16px; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ---------- 常量定义 ----------
        const GENDER_OPTS = ["男", "女"];
        const OCCUPATION_OPTS = ["医生", "律师", "记者", "画家", "侦探", "警察"];
        const NATIONALITY_OPTS = ["美国", "英国", "中国", "日本", "韩国"];
        const RULE_OPTS = ["COC7th", "DND5e"];
        const ERA_OPTS = ["1920s", "现代", "架空"];
        const OUTCOME_OPTS = ["死亡", "生还", "进行中", "散桌"];

        const BLANK_PC = {
            id: null,
            avatar: "",
            name: "",
            gender: "",
            age: "",
            occupation: "",
            nationality: "",
            birthday: "",
            attributes: [{ name: "力量", value: "" }, { name: "敏捷", value: "" }],
            background: "",
            appearances: []
        };

        const CUSTOM_TAGS_KEY = 'pc_custom_tags_v2';
        const PC_DATA_KEY = 'pc_book_v2';

        // ---------- 辅助函数：生成扇形图数据 (修复单一片区) ----------
        const generatePieData = (data) => {
            const total = data.reduce((sum, item) => sum + item.value, 0);
            if (total === 0) return [];
            let slices = [];
            let startAngle = -90;
            data.forEach(item => {
                let angle = (item.value / total) * 360;
                // 处理整圆情况：分成两个半圆，保证SVG弧线有效
                if (Math.abs(angle - 360) < 0.01) {
                    const halfValue = item.value / 2;
                    const halfAngle = 180;
                    // 第一个半圆
                    const endAngle1 = startAngle + halfAngle;
                    const startRad1 = (startAngle * Math.PI) / 180;
                    const endRad1 = (endAngle1 * Math.PI) / 180;
                    const x1_1 = 50 + 40 * Math.cos(startRad1);
                    const y1_1 = 50 + 40 * Math.sin(startRad1);
                    const x2_1 = 50 + 40 * Math.cos(endRad1);
                    const y2_1 = 50 + 40 * Math.sin(endRad1);
                    const path1 = `M 50 50 L ${x1_1} ${y1_1} A 40 40 0 0 1 ${x2_1} ${y2_1} Z`;
                    slices.push({ ...item, value: halfValue, path: path1, startAngle, endAngle: endAngle1 });
                    
                    startAngle = endAngle1;
                    const endAngle2 = startAngle + halfAngle;
                    const startRad2 = (startAngle * Math.PI) / 180;
                    const endRad2 = (endAngle2 * Math.PI) / 180;
                    const x1_2 = 50 + 40 * Math.cos(startRad2);
                    const y1_2 = 50 + 40 * Math.sin(startRad2);
                    const x2_2 = 50 + 40 * Math.cos(endRad2);
                    const y2_2 = 50 + 40 * Math.sin(endRad2);
                    const path2 = `M 50 50 L ${x1_2} ${y1_2} A 40 40 0 0 1 ${x2_2} ${y2_2} Z`;
                    slices.push({ ...item, value: halfValue, path: path2, startAngle, endAngle: endAngle2 });
                    startAngle = endAngle2;
                } else {
                    const endAngle = startAngle + angle;
                    const startRad = (startAngle * Math.PI) / 180;
                    const endRad = (endAngle * Math.PI) / 180;
                    const x1 = 50 + 40 * Math.cos(startRad);
                    const y1 = 50 + 40 * Math.sin(startRad);
                    const x2 = 50 + 40 * Math.cos(endRad);
                    const y2 = 50 + 40 * Math.sin(endRad);
                    const largeArcFlag = angle > 180 ? 1 : 0;
                    const pathData = `M 50 50 L ${x1} ${y1} A 40 40 0 ${largeArcFlag} 1 ${x2} ${y2} Z`;
                    slices.push({ ...item, path: pathData, startAngle, endAngle });
                    startAngle = endAngle;
                }
            });
            return slices;
        };

        // ---------- 头像裁剪模态框 ----------
        function AvatarCropModal({ file, onCancel, onConfirm }) {
            const [img, setImg] = useState(null);
            const [scale, setScale] = useState(1);
            const [offset, setOffset] = useState({ x: 0, y: 0 });
            const [isDragging, setIsDragging] = useState(false);
            const [dragStart, setDragStart] = useState({ x: 0, y: 0 });
            const canvasRef = useRef(null);
            const containerSize = 200; // 裁剪区域 200x200

            useEffect(() => {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const image = new Image();
                    image.onload = () => {
                        setImg(image);
                        // 初始缩放：让图片最小边填满容器
                        const scaleX = containerSize / image.width;
                        const scaleY = containerSize / image.height;
                        const initScale = Math.max(scaleX, scaleY); // 确保覆盖
                        setScale(initScale);
                        setOffset({ x: 0, y: 0 }); // 居中需要计算，稍后绘制时处理
                    };
                    image.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }, [file]);

            // 绘制canvas
            useEffect(() => {
                if (!img || !canvasRef.current) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                canvas.width = containerSize;
                canvas.height = containerSize;
                ctx.clearRect(0, 0, containerSize, containerSize);

                const drawWidth = img.width * scale;
                const drawHeight = img.height * scale;
                // 计算偏移使图片居中显示（初始时偏移0意味着图片左上角在(0,0)，我们需要偏移使得图片中心与canvas中心对齐）
                // 但我们希望初始显示图片中间部分，所以偏移设置为 (canvas.width/2 - drawWidth/2, canvas.height/2 - drawHeight/2)
                // 但为了允许拖动，我们使用offset变量，初始offset为0，但配合偏移量使图片居中：实际绘制位置 = offset + (canvas.width/2 - drawWidth/2)
                const baseX = (containerSize - drawWidth) / 2;
                const baseY = (containerSize - drawHeight) / 2;
                const drawX = baseX + offset.x;
                const drawY = baseY + offset.y;

                ctx.drawImage(img, drawX, drawY, drawWidth, drawHeight);
            }, [img, scale, offset]);

            const handleMouseDown = (e) => {
                e.preventDefault();
                setIsDragging(true);
                setDragStart({ x: e.clientX - offset.x, y: e.clientY - offset.y });
            };

            const handleMouseMove = (e) => {
                if (!isDragging) return;
                e.preventDefault();
                const newX = e.clientX - dragStart.x;
                const newY = e.clientY - dragStart.y;

                // 边界限制，确保图片始终覆盖canvas
                if (img) {
                    const drawWidth = img.width * scale;
                    const drawHeight = img.height * scale;
                    const baseX = (containerSize - drawWidth) / 2;
                    const baseY = (containerSize - drawHeight) / 2;
                    const minX = -baseX - (drawWidth - containerSize); // 图片左边缘不能超过canvas左边缘? 计算边界
                    const maxX = -baseX; // 图片右边缘不能超过canvas右边缘
                    const minY = -baseY - (drawHeight - containerSize);
                    const maxY = -baseY;

                    // 限制偏移
                    const boundedX = Math.min(maxX, Math.max(minX, newX));
                    const boundedY = Math.min(maxY, Math.max(minY, newY));
                    setOffset({ x: boundedX, y: boundedY });
                } else {
                    setOffset({ x: newX, y: newY });
                }
            };

            const handleMouseUp = () => {
                setIsDragging(false);
            };

            useEffect(() => {
                if (isDragging) {
                    window.addEventListener('mousemove', handleMouseMove);
                    window.addEventListener('mouseup', handleMouseUp);
                } else {
                    window.removeEventListener('mousemove', handleMouseMove);
                    window.removeEventListener('mouseup', handleMouseUp);
                }
                return () => {
                    window.removeEventListener('mousemove', handleMouseMove);
                    window.removeEventListener('mouseup', handleMouseUp);
                };
            }, [isDragging, offset, dragStart, img, scale]);

            const handleConfirm = () => {
                if (!canvasRef.current) return;
                const dataUrl = canvasRef.current.toDataURL('image/png');
                onConfirm(dataUrl);
            };

            if (!img) return null;

            return (
                <div className="crop-modal-overlay" onClick={onCancel}>
                    <div className="crop-modal" onClick={(e) => e.stopPropagation()}>
                        <h3 style={{ color: 'var(--primary)', marginTop: 0 }}>裁剪头像</h3>
                        <div className="crop-canvas-container">
                            <canvas
                                ref={canvasRef}
                                width={containerSize}
                                height={containerSize}
                                className="crop-canvas"
                                onMouseDown={handleMouseDown}
                            />
                        </div>
                        <input
                            type="range"
                            min="0.5"
                            max="3"
                            step="0.01"
                            value={scale}
                            onChange={(e) => setScale(parseFloat(e.target.value))}
                            className="crop-slider"
                        />
                        <div className="crop-actions">
                            <button className="btn btn-outline" onClick={onCancel}>取消</button>
                            <button className="btn" onClick={handleConfirm}>确认</button>
                        </div>
                    </div>
                </div>
            );
        }

        // ---------- 自定义标签选择器组件 ----------
        function TagSelector({ field, presetOpts, customTags, setCustomTags, value, onChange, placeholder = "选择标签..." }) {
            const [isOpen, setIsOpen] = useState(false);
            const [newTagMode, setNewTagMode] = useState(false);
            const [newTagInput, setNewTagInput] = useState('');
            const wrapperRef = useRef(null);

            const allTags = [...new Set([...presetOpts, ...(customTags[field] || [])])];

            useEffect(() => {
                function handleClickOutside(e) {
                    if (wrapperRef.current && !wrapperRef.current.contains(e.target)) {
                        setIsOpen(false);
                        setNewTagMode(false);
                        setNewTagInput('');
                    }
                }
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            const handleSelectTag = (tag) => {
                onChange(tag);
                setIsOpen(false);
            };

            const handleRemoveTag = (e, tag) => {
                e.stopPropagation();
                onChange('');
            };

            const handleAddNewTag = () => {
                if (newTagInput.trim()) {
                    const newTag = newTagInput.trim();
                    const updated = { ...customTags };
                    if (!updated[field]) updated[field] = [];
                    if (!updated[field].includes(newTag)) {
                        updated[field] = [...updated[field], newTag];
                        setCustomTags(updated);
                    }
                    onChange(newTag);
                    setNewTagMode(false);
                    setNewTagInput('');
                    setIsOpen(false);
                }
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter') {
                    handleAddNewTag();
                }
            };

            return (
                <div className="tag-selector" ref={wrapperRef}>
                    <div className="tag-selector-display" onClick={() => setIsOpen(!isOpen)}>
                        {value ? (
                            <span className="tag">
                                {value}
                                <span className="remove-tag" onClick={(e) => handleRemoveTag(e, value)}>✕</span>
                            </span>
                        ) : (
                            <span className="placeholder">{placeholder}</span>
                        )}
                    </div>

                    {isOpen && (
                        <div className="tag-dropdown">
                            {allTags.map(tag => (
                                <div key={tag} className="tag-dropdown-item" onClick={() => handleSelectTag(tag)}>
                                    {tag}
                                </div>
                            ))}
                            {newTagMode ? (
                                <div className="new-tag-input">
                                    <input
                                        type="text"
                                        value={newTagInput}
                                        onChange={(e) => setNewTagInput(e.target.value)}
                                        onKeyDown={handleKeyDown}
                                        placeholder="输入新标签"
                                        autoFocus
                                    />
                                    <button onClick={handleAddNewTag}>确认</button>
                                </div>
                            ) : (
                                <div className="tag-dropdown-item new-tag" onClick={() => setNewTagMode(true)}>
                                    + 新建标签
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        // ---------- 编辑模态框 (使用裁剪) ----------
        function EditPcModal({ pc, onSave, onClose, customTags, setCustomTags }) {
            const [form, setForm] = useState(pc);
            const [cropFile, setCropFile] = useState(null);
            const [showCrop, setShowCrop] = useState(false);

            const handleAvatarClick = () => {
                document.getElementById('edit-avatar-input').click();
            };

            const handleAvatarChange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 5 * 1024 * 1024) {
                    alert('头像图片不能超过5MB');
                    return;
                }
                setCropFile(file);
                setShowCrop(true);
            };

            const handleCropConfirm = (croppedUrl) => {
                setForm({ ...form, avatar: croppedUrl });
                setShowCrop(false);
                setCropFile(null);
            };

            // 其余逻辑与之前相同
            const [birthYear, setBirthYear] = useState(pc.birthday ? pc.birthday.split('-')[0] || '' : '');
            const [birthMonth, setBirthMonth] = useState(pc.birthday ? pc.birthday.split('-')[1] || '' : '');
            const [birthDay, setBirthDay] = useState(pc.birthday ? pc.birthday.split('-')[2] || '' : '');

            useEffect(() => {
                if (birthYear && birthMonth && birthDay) {
                    const paddedMonth = birthMonth.padStart(2, '0');
                    const paddedDay = birthDay.padStart(2, '0');
                    setForm(f => ({ ...f, birthday: `${birthYear}-${paddedMonth}-${paddedDay}` }));
                } else {
                    setForm(f => ({ ...f, birthday: '' }));
                }
            }, [birthYear, birthMonth, birthDay]);

            const addAttribute = () => {
                setForm({ ...form, attributes: [...form.attributes, { name: "", value: "" }] });
            };
            const removeAttribute = (index) => {
                const newAttrs = form.attributes.filter((_, i) => i !== index);
                setForm({ ...form, attributes: newAttrs });
            };

            const addAppearance = () => {
                setForm({
                    ...form,
                    appearances: [
                        ...form.appearances,
                        { id: Date.now(), module: "", rule: "", background: "", era: "", outcome: "", teammates: [] }
                    ]
                });
            };
            const removeAppearance = (index) => {
                const newApps = form.appearances.filter((_, i) => i !== index);
                setForm({ ...form, appearances: newApps });
            };
            const updateAppearance = (index, field, value) => {
                const newApps = [...form.appearances];
                newApps[index][field] = value;
                setForm({ ...form, appearances: newApps });
            };
            const addTeammate = (appIndex) => {
                const newApps = [...form.appearances];
                newApps[appIndex].teammates.push({ id: Date.now() + Math.random(), pc: "", pl: "", contact: "" });
                setForm({ ...form, appearances: newApps });
            };
            const updateTeammate = (appIndex, tmIndex, field, value) => {
                const newApps = [...form.appearances];
                newApps[appIndex].teammates[tmIndex][field] = value;
                setForm({ ...form, appearances: newApps });
            };
            const removeTeammate = (appIndex, tmIndex) => {
                const newApps = [...form.appearances];
                newApps[appIndex].teammates = newApps[appIndex].teammates.filter((_, i) => i !== tmIndex);
                setForm({ ...form, appearances: newApps });
            };

            const handleSave = () => {
                if (!form.name.trim()) {
                    alert("请输入PC姓名");
                    return;
                }
                onSave(form);
            };

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" onClick={(e) => e.stopPropagation()}>
                        <div className="modal-header">
                            <h2>编辑PC</h2>
                            <button className="modal-close" onClick={onClose}>×</button>
                        </div>

                        <div className="avatar-upload">
                            <div className="avatar" onClick={handleAvatarClick} style={{ cursor: 'pointer' }}>
                                {form.avatar ? <img src={form.avatar} alt="avatar" /> : form.name ? form.name[0].toUpperCase() : "?"}
                            </div>
                            <label htmlFor="edit-avatar-input" onClick={handleAvatarClick}>更换头像</label>
                            <input type="file" id="edit-avatar-input" accept="image/*" onChange={handleAvatarChange} style={{ display: 'none' }} />
                        </div>

                        {/* 裁剪模态框 */}
                        {showCrop && cropFile && (
                            <AvatarCropModal
                                file={cropFile}
                                onCancel={() => { setShowCrop(false); setCropFile(null); }}
                                onConfirm={handleCropConfirm}
                            />
                        )}

                        {/* 其余表单与之前相同 */}
                        <div className="form-grid">
                            <div className="form-group full-width"><label>姓名</label><input value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} /></div>
                            <div className="form-group"><label>性别</label><TagSelector field="gender" presetOpts={GENDER_OPTS} customTags={customTags} setCustomTags={setCustomTags} value={form.gender} onChange={(val) => setForm({ ...form, gender: val })} /></div>
                            <div className="form-group"><label>年龄</label><input value={form.age} onChange={e => setForm({ ...form, age: e.target.value })} /></div>
                            <div className="form-group"><label>职业</label><TagSelector field="occupation" presetOpts={OCCUPATION_OPTS} customTags={customTags} setCustomTags={setCustomTags} value={form.occupation} onChange={(val) => setForm({ ...form, occupation: val })} /></div>
                            <div className="form-group"><label>国籍</label><TagSelector field="nationality" presetOpts={NATIONALITY_OPTS} customTags={customTags} setCustomTags={setCustomTags} value={form.nationality} onChange={(val) => setForm({ ...form, nationality: val })} /></div>
                            <div className="form-group full-width">
                                <label>生日</label>
                                <div style={{ display: 'flex', gap: 8 }}>
                                    <input type="text" placeholder="年" value={birthYear} onChange={e => setBirthYear(e.target.value.replace(/\D/g, ''))} maxLength="4" style={{ flex: 1 }} />
                                    <input type="text" placeholder="月" value={birthMonth} onChange={e => setBirthMonth(e.target.value.replace(/\D/g, ''))} maxLength="2" style={{ flex: 1 }} />
                                    <input type="text" placeholder="日" value={birthDay} onChange={e => setBirthDay(e.target.value.replace(/\D/g, ''))} maxLength="2" style={{ flex: 1 }} />
                                </div>
                            </div>
                        </div>

                        <div style={{ marginTop: 20 }}>
                            <h3 style={{ color: 'var(--primary)', fontSize: '1rem' }}>属性</h3>
                            {form.attributes.map((attr, index) => (
                                <div key={index} style={{ display: 'flex', gap: 10, marginBottom: 8 }}>
                                    <input placeholder="属性名" value={attr.name} onChange={e => {
                                        const newAttrs = [...form.attributes];
                                        newAttrs[index].name = e.target.value;
                                        setForm({ ...form, attributes: newAttrs });
                                    }} style={{ flex: 1 }} />
                                    <input placeholder="属性值" value={attr.value} onChange={e => {
                                        const newAttrs = [...form.attributes];
                                        newAttrs[index].value = e.target.value;
                                        setForm({ ...form, attributes: newAttrs });
                                    }} style={{ flex: 1 }} />
                                    {form.attributes.length > 1 && (
                                        <button className="btn btn-sm btn-outline" onClick={() => removeAttribute(index)}>删除</button>
                                    )}
                                </div>
                            ))}
                            <button className="btn btn-outline btn-sm" onClick={addAttribute}>+ 添加属性</button>
                        </div>

                        <div style={{ marginTop: 20 }}>
                            <h3 style={{ color: 'var(--primary)', fontSize: '1rem' }}>角色背景</h3>
                            <textarea rows="4" value={form.background} onChange={e => setForm({ ...form, background: e.target.value })} style={{ width: '100%', padding: 10, borderRadius: 8, border: '1px solid var(--border)' }} />
                        </div>

                        <div style={{ marginTop: 20 }}>
                            <h3 style={{ color: 'var(--primary)', fontSize: '1rem' }}>登场情况</h3>
                            {form.appearances.map((app, appIndex) => (
                                <div key={app.id} style={{ border: '1px solid var(--border)', borderRadius: 12, padding: 16, marginBottom: 16, background: 'var(--bg)' }}>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
                                        <span style={{ fontWeight: 600 }}>登场 #{appIndex + 1}</span>
                                        <button className="btn btn-outline btn-sm" onClick={() => removeAppearance(appIndex)}>删除</button>
                                    </div>
                                    <div className="form-grid" style={{ marginBottom: 10 }}>
                                        <div className="form-group full-width"><label>登场模组</label><input value={app.module} onChange={e => updateAppearance(appIndex, 'module', e.target.value)} /></div>
                                        <div className="form-group"><label>所用规则</label><TagSelector field="rule" presetOpts={RULE_OPTS} customTags={customTags} setCustomTags={setCustomTags} value={app.rule} onChange={(val) => updateAppearance(appIndex, 'rule', val)} /></div>
                                        <div className="form-group"><label>模组背景</label><TagSelector field="background" presetOpts={NATIONALITY_OPTS} customTags={customTags} setCustomTags={setCustomTags} value={app.background} onChange={(val) => updateAppearance(appIndex, 'background', val)} /></div>
                                        <div className="form-group"><label>模组年代</label><TagSelector field="era" presetOpts={ERA_OPTS} customTags={customTags} setCustomTags={setCustomTags} value={app.era} onChange={(val) => updateAppearance(appIndex, 'era', val)} /></div>
                                        <div className="form-group"><label>模组结局</label><TagSelector field="outcome" presetOpts={OUTCOME_OPTS} customTags={customTags} setCustomTags={setCustomTags} value={app.outcome} onChange={(val) => updateAppearance(appIndex, 'outcome', val)} /></div>
                                    </div>
                                    <div style={{ marginTop: 10 }}>
                                        <label style={{ fontSize: '0.8rem', fontWeight: 600, color: 'var(--text-light)' }}>队友</label>
                                        {app.teammates.map((tm, tmIndex) => (
                                            <div key={tm.id} style={{ display: 'flex', gap: 8, marginTop: 8, alignItems: 'center' }}>
                                                <input placeholder="队友PC" value={tm.pc} onChange={e => updateTeammate(appIndex, tmIndex, 'pc', e.target.value)} style={{ flex: 1 }} />
                                                <input placeholder="PL" value={tm.pl} onChange={e => updateTeammate(appIndex, tmIndex, 'pl', e.target.value)} style={{ flex: 1 }} />
                                                <input placeholder="联系方式" value={tm.contact} onChange={e => updateTeammate(appIndex, tmIndex, 'contact', e.target.value)} style={{ flex: 1 }} />
                                                <button className="btn btn-outline btn-sm" onClick={() => removeTeammate(appIndex, tmIndex)}>✕</button>
                                            </div>
                                        ))}
                                        <button className="btn btn-outline btn-sm" style={{ marginTop: 8 }} onClick={() => addTeammate(appIndex)}>+ 添加队友</button>
                                    </div>
                                </div>
                            ))}
                            <button className="btn btn-outline" onClick={addAppearance}>+ 添加登场情况</button>
                        </div>

                        <div style={{ marginTop: 30, display: 'flex', gap: 10, justifyContent: 'flex-end' }}>
                            <button className="btn" onClick={handleSave}>保存修改</button>
                            <button className="btn btn-outline" onClick={onClose}>取消</button>
                        </div>
                    </div>
                </div>
            );
        }

        // ---------- 概览页面 (增加一键清除) ----------
        function Overview({ pcs, setPcs, customTags, setCustomTags }) {
            const [expandedId, setExpandedId] = useState(null);
            const [editingPc, setEditingPc] = useState(null);

            const handleEdit = (pc) => {
                setEditingPc(pc);
            };

            const handleSaveEdit = (updatedPc) => {
                setPcs(pcs.map(p => p.id === updatedPc.id ? updatedPc : p));
                setEditingPc(null);
            };

            const handleDelete = (id) => {
                if (window.confirm('确定要删除这个PC吗？此操作不可恢复。')) {
                    setPcs(pcs.filter(p => p.id !== id));
                    if (expandedId === id) setExpandedId(null);
                }
            };

            const handleClearAll = () => {
                if (window.confirm('⚠️ 确定要清空所有PC吗？此操作不可恢复！')) {
                    setPcs([]);
                    setExpandedId(null);
                }
            };

            return (
                <div>
                    <div className="flex-between">
                        <div style={{ color: 'var(--text-light)' }}>共 {pcs.length} 个PC</div>
                        {pcs.length > 0 && (
                            <button className="btn btn-outline btn-sm btn-danger" onClick={handleClearAll}>清除所有PC</button>
                        )}

        // ---------- 统计页面 (扇形图) ----------
        function Stats({ pcs }) {
            const countBy = (items, keyFunc) => {
                const map = {};
                items.forEach(item => {
                    const val = keyFunc(item);
                    if (val) map[val] = (map[val] || 0) + 1;
                });
                return map;
            };

            const genderMap = countBy(pcs, pc => pc.gender);
            const nationalityMap = countBy(pcs, pc => pc.nationality);
            const occupationMap = countBy(pcs, pc => pc.occupation);

            const ruleMap = {};
            const outcomeMap = {};
            const eraMap = {};
            pcs.forEach(pc => {
                (pc.appearances || []).forEach(app => {
                    if (app.rule) ruleMap[app.rule] = (ruleMap[app.rule] || 0) + 1;
                    if (app.outcome) outcomeMap[app.outcome] = (outcomeMap[app.outcome] || 0) + 1;
                    if (app.era) eraMap[app.era] = (eraMap[app.era] || 0) + 1;
                });
            });

            const getColors = () => {
                const root = getComputedStyle(document.body);
                const primary = root.getPropertyValue('--primary').trim();
                const light = root.getPropertyValue('--primary-light').trim();
                const dark = root.getPropertyValue('--primary-dark').trim();
                return [primary, light, dark, '#b0a5a5', '#c2b2b2', '#d8c8c8'];
            };

            const colors = getColors();

            const genderData = Object.entries(genderMap).map(([label, value], i) => ({ label, value, color: colors[i % colors.length] }));
            const nationalityData = Object.entries(nationalityMap).map(([label, value], i) => ({ label, value, color: colors[(i+1) % colors.length] }));
            const occupationData = Object.entries(occupationMap).map(([label, value], i) => ({ label, value, color: colors[(i+2) % colors.length] }));
            const ruleData = Object.entries(ruleMap).map(([label, value], i) => ({ label, value, color: colors[(i+3) % colors.length] }));
            const outcomeData = Object.entries(outcomeMap).map(([label, value], i) => ({ label, value, color: colors[(i+4) % colors.length] }));
            const eraData = Object.entries(eraMap).map(([label, value], i) => ({ label, value, color: colors[(i+5) % colors.length] }));

            const PieChart = ({ data, title }) => {
                if (data.length === 0) {
                    return <div style={{ textAlign: 'center', padding: 20, color: 'var(--text-light)' }}>暂无数据</div>;
                }
                const total = data.reduce((sum, d) => sum + d.value, 0);
                const slices = generatePieData(data);
                const cardBg = getComputedStyle(document.body).getPropertyValue('--card-bg').trim();
                return (
                    <div>
                        <div className="chart-title">{title}</div>
                        <svg width="120" height="120" viewBox="0 0 100 100" className="pie-svg" xmlns="http://www.w3.org/2000/svg">
                            {slices.map((slice, i) => {
                                const percent = Math.round((slice.value / total) * 100);
                                return (
                                    <path key={i} d={slice.path} fill={slice.color} stroke="white" strokeWidth="1">
                                        <title>{slice.label} - {percent}%</title>
                                    </path>
                                );
                            })}
                            <circle cx="50" cy="50" r="20" fill={cardBg} stroke="white" strokeWidth="1" />
                        </svg>
                        <div className="pie-legend">
                            {data.map(item => {
                                const percent = Math.round((item.value / total) * 100);
                                return (
                                    <div key={item.label} className="legend-item">
                                        <div className="legend-color" style={{ background: item.color }}></div>
                                        <span>{item.label} ({item.value} · {percent}%)</span>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            return (
                <div>
                    <div className="stats-header">现有PC数量：{pcs.length}</div>
                    <div className="chart-container">
                        <div className="chart-box"><PieChart data={genderData} title="性别分布" /></div>
                        <div className="chart-box"><PieChart data={nationalityData} title="国籍分布" /></div>
                        <div className="chart-box"><PieChart data={occupationData} title="职业分布" /></div>
                        <div className="chart-box"><PieChart data={ruleData} title="规则使用" /></div>
                        <div className="chart-box"><PieChart data={outcomeData} title="模组结局" /></div>
                        <div className="chart-box"><PieChart data={eraData} title="模组年代" /></div>
                    </div>
                </div>
            );
        }

        // ---------- 分享页面 (修复扇形图PDF) ----------
        function Share({ pcs }) {
            const [selectedPcId, setSelectedPcId] = useState('');
            const [isExporting, setIsExporting] = useState(false);

            const forceReflow = (element) => {
                if (element) {
                    void element.offsetHeight;
                }
            };

            const exportToPNG = (element, filename) => {
                if (!element) return;
                setIsExporting(true);
                forceReflow(element);
                html2canvas(element, { scale: 1.5, backgroundColor: null, logging: false, allowTaint: false, useCORS: true }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = filename + '.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    setIsExporting(false);
                }).catch(err => {
                    console.error('PNG导出失败', err);
                    alert('PNG导出失败，可能是内容过长，请尝试分批导出');
                    setIsExporting(false);
                });
            };

            const exportToPDF = async (element, filename) => {
                if (!element) return;
                setIsExporting(true);

                try {
                    const clone = element.cloneNode(true);
                    clone.style.position = 'absolute';
                    clone.style.left = '0';
                    clone.style.top = '0';
                    clone.style.width = '800px';
                    clone.style.background = 'var(--bg)';
                    clone.style.zIndex = '9999';
                    clone.style.pointerEvents = 'none';
                    document.body.appendChild(clone);

                    forceReflow(clone);

                    const canvas = await html2canvas(clone, {
                        scale: 1.2,
                        backgroundColor: null,
                        logging: false,
                        windowWidth: 800,
                        allowTaint: false,
                        useCORS: true
                    });

                    document.body.removeChild(clone);

                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF({
                        orientation: 'portrait',
                        unit: 'mm',
                        format: 'a4'
                    });

                    const imgWidth = 190;
                    const pageHeight = 297;
                    const imgHeight = (canvas.height * imgWidth) / canvas.width;
                    
                    let heightLeft = imgHeight;
                    let position = 0;
                    let page = 1;

                    pdf.addImage(canvas, 'JPEG', 10, position + 10, imgWidth, imgHeight, undefined, 'FAST');
                    heightLeft -= pageHeight;

                    while (heightLeft > 0) {
                        position = -pageHeight * page;
                        pdf.addPage();
                        pdf.addImage(canvas, 'JPEG', 10, position + 10, imgWidth, imgHeight, undefined, 'FAST');
                        heightLeft -= pageHeight;
                        page++;
                    }

                    pdf.save(filename + '.pdf');
                } catch (error) {
                    console.error('PDF导出失败', error);
                    alert('PDF导出失败，内容可能过多，请减少PC数量或分批导出');
                } finally {
                    setIsExporting(false);
                }
            };

            const tryExport = (type, format) => {
                let content = null;
                let filename = '';
                if (type === 'full') { content = buildFullBook(); filename = 'full_pc_book'; }
                else if (type === 'overview') { content = buildOverview(); filename = 'pc_overview'; }
                else if (type === 'single') {
                    if (!selectedPcId) { alert('请选择一个PC'); return; }
                    content = buildSinglePc(Number(selectedPcId)); filename = `pc_${selectedPcId}`;
                } else if (type === 'stats') { content = buildStats(); filename = 'pc_stats'; }
                if (!content) return;

                const tempDiv = document.createElement('div');
                tempDiv.appendChild(content);
                tempDiv.style.position = 'absolute';
                tempDiv.style.left = '-9999px';
                tempDiv.style.top = '0';
                document.body.appendChild(tempDiv);

                if (format === 'png') {
                    exportToPNG(tempDiv, filename);
                } else {
                    exportToPDF(tempDiv, filename);
                }

                setTimeout(() => {
                    if (document.body.contains(tempDiv)) {
                        document.body.removeChild(tempDiv);
                    }
                }, 1000);
            };

            // 构建函数 (buildStats 已修复扇形图缺失和中心圆)
            const buildFullBook = () => {
                const container = document.createElement('div');
                container.style.padding = '20px';
                container.style.background = 'var(--bg)';
                container.style.width = '800px';
                pcs.forEach(pc => {
                    const pcDiv = document.createElement('div');
                    pcDiv.className = 'card';
                    const header = document.createElement('div');
                    header.style.display = 'flex';
                    header.style.gap = '20px';
                    header.style.marginBottom = '15px';
                    if (pc.avatar) {
                        const img = document.createElement('img');
                        img.src = pc.avatar;
                        img.style.width = '60px';
                        img.style.height = '60px';
                        img.style.borderRadius = '50%';
                        img.style.objectFit = 'cover';
                        header.appendChild(img);
                    }
                    const infoDiv = document.createElement('div');
                    infoDiv.innerHTML = `<h3 style="margin:0 0 5px 0;">${pc.name}</h3><div>${pc.gender ? `<span class="tag">${pc.gender}</span>` : ''}${pc.age ? `<span class="tag">${pc.age}岁</span>` : ''}${pc.occupation ? `<span class="tag">${pc.occupation}</span>` : ''}${pc.nationality ? `<span class="tag">${pc.nationality}</span>` : ''}</div>`;
                    header.appendChild(infoDiv);
                    pcDiv.appendChild(header);
                    if (pc.attributes && pc.attributes.length) {
                        const attrTitle = document.createElement('h4');
                        attrTitle.textContent = '属性';
                        pcDiv.appendChild(attrTitle);
                        const attrGrid = document.createElement('div');
                        attrGrid.style.display = 'grid';
                        attrGrid.style.gridTemplateColumns = 'repeat(2, 1fr)';
                        attrGrid.style.gap = '5px';
                        pc.attributes.forEach(attr => {
                            const attrItem = document.createElement('div');
                            attrItem.style.display = 'flex';
                            attrItem.style.justifyContent = 'space-between';
                            attrItem.style.padding = '4px 8px';
                            attrItem.style.background = 'var(--bg)';
                            attrItem.style.borderRadius = '4px';
                            attrItem.innerHTML = `<span style="font-weight:600;">${attr.name}</span> <span>${attr.value}</span>`;
                            attrGrid.appendChild(attrItem);
                        });
                        pcDiv.appendChild(attrGrid);
                    }
                    if (pc.background) {
                        const bgTitle = document.createElement('h4');
                        bgTitle.textContent = '背景';
                        pcDiv.appendChild(bgTitle);
                        const bgPara = document.createElement('p');
                        bgPara.style.background = 'var(--bg)';

                        bgPara.style.borderRadius = '8px';
                        bgPara.style.whiteSpace = 'pre-wrap';
                        bgPara.textContent = pc.background;
                        pcDiv.appendChild(bgPara);
                    }
                    if (pc.appearances && pc.appearances.length) {
                        const appTitle = document.createElement('h4');
                        appTitle.textContent = '登场情况';
                        pcDiv.appendChild(appTitle);
                        pc.appearances.forEach(app => {
                            const appDiv = document.createElement('div');
